# What lab-harness tells the model, besides the conversation and the tool
# declarations.
#
# This file is the default for the [prompts] config section and uses its format
# exactly, so a config file replaces a prompt with the same key; --system-prompt
# and --system-prompt-file replace `system` for one run. Every key is checked as
# strictly as in any config file. The schema, with what each key means, is
# `PromptsConfig` in lab_harness/config.py.
#
# Name no tools here. What the model can call, and how to use it, comes from the
# tool declarations alone, so the prompt stays true whatever tools.enabled or
# --tools selects. Advice about one tool belongs in that tool's description.
#
# A line ending in a backslash continues its paragraph: the text sent has no
# break there, so wrapping lines in this file changes nothing the model sees.

[prompts]

system = """\
You are a helpful assistant running in a terminal. Look at a file before you \
change it. Keep responses concise."""

# Appended to `system`, after a blank line, when the working directory has
# project instructions (see [project]). {name} is the file's name, {text} its
# contents.
project_instructions = """\
## Project instructions ({name})

These come from the working directory and describe this project's own \
conventions. Follow them.

{text}"""
